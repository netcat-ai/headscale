name: Netcat container
on:
  push:
    branches: [main, codex/tencentcloud-dns]
    paths: ["**/*.go", "go.*", "*.nix", "flake.lock", "flakehashes.json", ".github/workflows/container-netcat.yml", ".github/scripts/verify-netcat-image.py"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: netcat-container-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.repository == 'netcat-ai/headscale'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6
      - uses: Mic92/hestia@dfed9ced335d28978ba74e513939a10db1f71025 # v3.1.0
      - name: Check DNS compatibility
        shell: nix develop --fallback --command bash -e {0}
        run: |
          go run ./cmd/vendorhash check
          go test ./hscontrol/dns -count=1
      - name: Build and publish immutable candidate
        id: publish
        shell: nix develop --fallback --command bash -e {0}
        env:
          KO_DOCKER_REPO: ghcr.io/netcat-ai/headscale
          KO_DEFAULTBASEIMAGE: gcr.io/distroless/base-debian13
          CGO_ENABLED: "0"
        run: |
          test -z "$(git status --porcelain)"
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          ko build --bare --platform=linux/amd64,linux/arm64 \
            --tags="sha-${GITHUB_SHA}" \
            --image-label="org.opencontainers.image.source=https://github.com/netcat-ai/headscale" \
            --image-label="org.opencontainers.image.revision=${GITHUB_SHA}" \
            --image-annotation="org.opencontainers.image.source=https://github.com/netcat-ai/headscale" \
            ./cmd/headscale > "$RUNNER_TEMP/published.txt"
          image="$(cat "$RUNNER_TEMP/published.txt")"
          [[ "$image" =~ ^ghcr.io/netcat-ai/headscale:sha-${GITHUB_SHA}@sha256:[0-9a-f]{64}$ ]]
          image="${KO_DOCKER_REPO}@${image##*@}"
          [[ "$image" =~ ^ghcr.io/netcat-ai/headscale@sha256:[0-9a-f]{64}$ ]]
          printf '%s\n' "$image" > "$RUNNER_TEMP/image.txt"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          printf 'Candidate: `%s`\n\nRevision: `%s`\n' "$image" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-reference
          path: ${{ runner.temp }}/image.txt
          retention-days: 90
  verify:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify published image and database rollback
        env:
          CANDIDATE_IMAGE: ${{ needs.build.outputs.image }}
          EXPECTED_ARCH: ${{ matrix.arch }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: python3 .github/scripts/verify-netcat-image.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: image-verification-${{ matrix.arch }}
          path: image-verification.json
          retention-days: 90
